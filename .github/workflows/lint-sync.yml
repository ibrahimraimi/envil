name: Lint & Mod Sync Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-check:
    name: Verify Code & Dependency Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: true

      - name: Run gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt -s:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi
